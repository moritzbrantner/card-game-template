name: Deploy GitHub Pages

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/gh-pages.yml'
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
  push:
    branches: [develop, staging]
    paths:
      - '.github/workflows/gh-pages.yml'
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify web workspace packages
        working-directory: apps/web
        run: |
          bun run packages:lint
          bun run packages:typecheck
          bun run packages:test

      - name: Build and audit GitHub Pages artifact
        working-directory: apps/web
        env:
          NEXT_DEPLOY_TARGET: gh-pages
          GITHUB_PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: bun run build:gh-pages

      - name: Verify GitHub Pages artifact
        working-directory: apps/web
        run: |
          set -euo pipefail

          test -f .generated/unlighthouse/ci-result.json
          test -f out/en/unlighthouse/index.html
          test -f out/de/unlighthouse/index.html

          for locale in en de; do
            test -f "out/${locale}/index.html"
            test -f "out/${locale}/uno/index.html"
            test -f "out/${locale}/phase-10/index.html"
            test -f "out/${locale}/poker/index.html"
            test -f "out/${locale}/tcg/index.html"
          done

          touch out/.nojekyll

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/web/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
