name: Deploy GitHub Pages

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/gh-pages.yml'
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
  workflow_run:
    workflows: [Develop, Staging]
    types: [completed]
    branches: [develop, staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify web workspace packages
        working-directory: apps/web
        run: |
          bun run packages:lint
          bun run packages:typecheck
          bun run packages:test

      - name: Build and audit GitHub Pages artifact
        working-directory: apps/web
        env:
          NEXT_DEPLOY_TARGET: gh-pages
          GITHUB_PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: bun run build:gh-pages

      - name: Verify GitHub Pages artifact
        working-directory: apps/web
        run: |
          set -euo pipefail

          test -f .generated/unlighthouse/ci-result.json
          test -f out/en/unlighthouse/index.html
          test -f out/de/unlighthouse/index.html

          for locale in en de; do
            test -f "out/${locale}/index.html"
            test -f "out/${locale}/uno/index.html"
            test -f "out/${locale}/phase-10/index.html"
            test -f "out/${locale}/poker/index.html"
            test -f "out/${locale}/tcg/index.html"
          done

          touch out/.nojekyll

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
