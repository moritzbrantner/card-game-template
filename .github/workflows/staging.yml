name: Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  staging:
    # Branch flow: staging is the final snapshot branch and does not promote further.
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/snapshot-stage.yml
    with:
      stage: staging
      tested_sha: ${{ github.sha }}
      promote: false
