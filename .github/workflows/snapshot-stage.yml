name: Snapshot Stage

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      tested_sha:
        required: true
        type: string
      promote_to:
        required: false
        type: string
        default: ""
      promote:
        required: false
        type: boolean
        default: false
    secrets:
      GH_PACKAGES_TOKEN:
        required: false
      GH_PROMOTION_TOKEN:
        required: false

env:
  GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

jobs:
  test:
    name: Run ${{ inputs.stage }} suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Run develop suite
        if: inputs.stage == 'develop'
        run: |
          bun run lint
          bun run check-types
          bun run build
          bun run test:unit

      - name: Run nightly suite
        if: inputs.stage == 'nightly'
        run: bun run test:integration

      - name: Run beta integration tests
        if: inputs.stage == 'beta'
        run: bun run test:integration

      - name: Install Xvfb
        if: inputs.stage == 'beta'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build desktop app
        if: inputs.stage == 'beta'
        run: bun run --filter desktop build

      - name: Run beta end-to-end tests
        if: inputs.stage == 'beta'
        shell: bash
        run: |
          desktop_status=0
          web_status=0

          xvfb-run -a env DEBUG=pw:browser,pw:api ELECTRON_ENABLE_LOGGING=1 bun run --filter desktop test:e2e || desktop_status=$?
          env DEBUG=pw:api,pw:webserver bun run --filter next-template test:e2e || web_status=$?

          if [ "${desktop_status}" -ne 0 ] || [ "${web_status}" -ne 0 ]; then
            exit 1
          fi

      - name: Upload desktop Playwright report
        if: always() && inputs.stage == 'beta'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-desktop
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          if-no-files-found: ignore

      - name: Upload web Playwright report
        if: always() && inputs.stage == 'beta'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-web
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

      - name: Run staging suite
        if: inputs.stage == 'staging'
        run: bun run benchmark

  promote:
    name: Promote ${{ inputs.stage }} to ${{ inputs.promote_to }}
    needs: [test]
    if: inputs.promote && inputs.promote_to != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require promotion token
        env:
          PROMOTION_TOKEN: ${{ secrets.GH_PROMOTION_TOKEN }}
        run: |
          if [ -z "${PROMOTION_TOKEN}" ]; then
            echo "::error::GH_PROMOTION_TOKEN is required for direct promotion because pushes made with GITHUB_TOKEN do not trigger downstream push workflows." >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PROMOTION_TOKEN }}

      - name: Verify snapshot branch flow
        env:
          TARGET_BRANCH: ${{ inputs.promote_to }}
          TESTED_SHA: ${{ inputs.tested_sha }}
        run: |
          # Branch flow: develop -> nightly -> beta -> staging, with each branch pinned to a tested commit.
          git fetch origin "${TARGET_BRANCH}"
          if ! git merge-base --is-ancestor "origin/${TARGET_BRANCH}" "${TESTED_SHA}"; then
            echo "::error::${TARGET_BRANCH} contains commits outside ${TESTED_SHA}. Snapshot branches must not drift." >&2
            exit 1
          fi

      - name: Promote exact tested commit
        env:
          TARGET_BRANCH: ${{ inputs.promote_to }}
          TESTED_SHA: ${{ inputs.tested_sha }}
        run: |
          REMOTE_REF="refs/remotes/origin/${TARGET_BRANCH}"
          EXPECTED_TARGET="$(git rev-parse "${REMOTE_REF}")"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_TARGET}" \
            origin \
            "${TESTED_SHA}:refs/heads/${TARGET_BRANCH}"
