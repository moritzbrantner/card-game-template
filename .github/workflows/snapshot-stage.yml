name: Snapshot Stage

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      tested_sha:
        required: true
        type: string
      promote_to:
        required: false
        type: string
        default: ''
      promote:
        required: false
        type: boolean
        default: false
      promote_workflows:
        description: Space-separated workflow files to dispatch on the promoted branch (defaults to <promote_to>.yml).
        required: false
        type: string
        default: ''

jobs:
  test:
    name: Run ${{ inputs.stage }} suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run develop suite
        if: inputs.stage == 'develop'
        run: |
          bun run lint
          bun run check-types
          bun run build
          bun run test:unit

      - name: Run nightly suite
        if: inputs.stage == 'nightly'
        run: bun run test:integration

      - name: Run beta integration tests
        if: inputs.stage == 'beta'
        run: bun run test:integration

      - name: Install Xvfb
        if: inputs.stage == 'beta'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build desktop app
        if: inputs.stage == 'beta'
        run: bun run --filter desktop build

      - name: Run beta end-to-end tests
        if: inputs.stage == 'beta'
        shell: bash
        run: |
          desktop_status=0
          web_status=0
          mobile_status=0

          xvfb-run -a env DEBUG=pw:browser,pw:api ELECTRON_ENABLE_LOGGING=1 bun run --filter desktop test:e2e || desktop_status=$?
          env DEBUG=pw:api,pw:webserver bun run --filter next-template test:e2e || web_status=$?
          env DEBUG=pw:api,pw:webserver bun run --filter mobile test:e2e || mobile_status=$?

          if [ "${desktop_status}" -ne 0 ] || [ "${web_status}" -ne 0 ] || [ "${mobile_status}" -ne 0 ]; then
            exit 1
          fi

      - name: Upload desktop Playwright report
        if: always() && inputs.stage == 'beta'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-desktop
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          if-no-files-found: ignore

      - name: Upload web Playwright report
        if: always() && inputs.stage == 'beta'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-web
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

      - name: Upload mobile Playwright report
        if: always() && inputs.stage == 'beta'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-mobile
          path: |
            apps/mobile/playwright-report
            apps/mobile/test-results
          if-no-files-found: ignore

      - name: Run staging suite
        if: inputs.stage == 'staging'
        run: bun run benchmark

  promote:
    name: Promote ${{ inputs.stage }} to ${{ inputs.promote_to }}
    needs: [test]
    if: inputs.promote && inputs.promote_to != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify snapshot branch flow
        env:
          TARGET_BRANCH: ${{ inputs.promote_to }}
          TESTED_SHA: ${{ inputs.tested_sha }}
        run: |
          # Branch flow: develop -> nightly -> beta -> staging, with each branch pinned to a tested commit.
          git fetch origin "${TARGET_BRANCH}"
          if ! git merge-base --is-ancestor "origin/${TARGET_BRANCH}" "${TESTED_SHA}"; then
            echo "::error::${TARGET_BRANCH} contains commits outside ${TESTED_SHA}. Snapshot branches must not drift." >&2
            exit 1
          fi

      - name: Promote exact tested commit
        env:
          TARGET_BRANCH: ${{ inputs.promote_to }}
          TESTED_SHA: ${{ inputs.tested_sha }}
        run: |
          REMOTE_REF="refs/remotes/origin/${TARGET_BRANCH}"
          EXPECTED_TARGET="$(git rev-parse "${REMOTE_REF}")"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_TARGET}" \
            origin \
            "${TESTED_SHA}:refs/heads/${TARGET_BRANCH}"

      - name: Start ${{ inputs.promote_to }} workflows
        # Pushes made with GITHUB_TOKEN do not start push-triggered workflows,
        # so the next stage (and any other branch workflows) are dispatched explicitly.
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.promote_to }}
          PROMOTE_WORKFLOWS: ${{ inputs.promote_workflows }}
        run: |
          for workflow in ${PROMOTE_WORKFLOWS:-${TARGET_BRANCH}.yml}; do
            gh workflow run "${workflow}" --repo "${GITHUB_REPOSITORY}" --ref "${TARGET_BRANCH}"
          done
