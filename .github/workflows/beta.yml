name: Beta

on:
  push:
    branches: [beta]
  workflow_dispatch:

jobs:
  beta:
    # Branch flow: beta is a tested snapshot of nightly, then promotes the same commit to staging.
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/snapshot-stage.yml
    with:
      stage: beta
      tested_sha: ${{ github.sha }}
      promote_to: staging
      promote_workflows: staging.yml gh-pages.yml
      promote: true
