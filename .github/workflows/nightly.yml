name: Nightly

on:
  push:
    branches: [nightly]

jobs:
  nightly:
    # Branch flow: nightly only moves from develop, then promotes the same tested commit to beta.
    permissions:
      contents: write
    uses: ./.github/workflows/snapshot-stage.yml
    with:
      stage: nightly
      tested_sha: ${{ github.sha }}
      promote_to: beta
      promote: true
    secrets: inherit
