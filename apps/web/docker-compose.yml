name: card-game-template-web

services:
  postgres:
    image: postgres:16-alpine@sha256:deb28ee471183cb0c303113dac9b2433c51eeeeb678def7af9a9ec5820367815
    container_name: card-game-template-web-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: next_template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '${POSTGRES_PORT:-55433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d next_template']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-dev:
    image: postgres:16-alpine@sha256:deb28ee471183cb0c303113dac9b2433c51eeeeb678def7af9a9ec5820367815
    container_name: '${DEV_DB_CONTAINER_NAME:-web-dev-postgres}'
    profiles: ['dev']
    environment:
      POSTGRES_DB: '${DEV_DB_NAME:-next_template}'
      POSTGRES_USER: '${DEV_DB_USER:-postgres}'
      POSTGRES_PASSWORD: '${DEV_DB_PASSWORD:-postgres}'
    ports:
      - '${DEV_DB_PORT:-55435}:5432'
    tmpfs:
      - /var/lib/postgresql/data:rw
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DEV_DB_USER:-postgres} -d ${DEV_DB_NAME:-next_template}',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  postgres-dev-host:
    image: postgres:16-alpine@sha256:deb28ee471183cb0c303113dac9b2433c51eeeeb678def7af9a9ec5820367815
    container_name: '${DEV_DB_HOST_CONTAINER_NAME:-web-dev-postgres-host}'
    profiles: ['dev']
    network_mode: host
    environment:
      POSTGRES_DB: '${DEV_DB_NAME:-next_template}'
      POSTGRES_USER: '${DEV_DB_USER:-postgres}'
      POSTGRES_PASSWORD: '${DEV_DB_PASSWORD:-postgres}'
    command: postgres -c "port=${DEV_DB_PORT:-55435}"
    tmpfs:
      - /var/lib/postgresql/data:rw
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DEV_DB_USER:-postgres} -d ${DEV_DB_NAME:-next_template} -p ${DEV_DB_PORT:-55435}',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  postgres-test:
    image: postgres:16-alpine@sha256:deb28ee471183cb0c303113dac9b2433c51eeeeb678def7af9a9ec5820367815
    container_name: '${TEST_DB_CONTAINER_NAME:-web-test-postgres}'
    profiles: ['test']
    environment:
      POSTGRES_DB: next_template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '${TEST_POSTGRES_PORT:-55435}:5432'
    tmpfs:
      - /var/lib/postgresql/data:rw
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d next_template']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  mailpit:
    image: axllent/mailpit:latest@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports:
      - '1029:1025' # SMTP
      - '8029:8025' # Web UI

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: card-game-template-web-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: '${MINIO_ROOT_USER:-minioadmin}'
      MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-minioadmin}'
    command: server /data --console-address ":9001"
    ports:
      - '${MINIO_API_PORT:-9002}:9000' # S3 API
      - '${MINIO_CONSOLE_PORT:-9003}:9001' # Web console
    volumes:
      - minio_data:/data

  minio-create-bucket:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      - minio
    restart: 'no'
    environment:
      MINIO_ROOT_USER: '${MINIO_ROOT_USER:-minioadmin}'
      MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-minioadmin}'
      MINIO_BUCKET: '${MINIO_BUCKET:-profile-images}'
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        sleep 1;
      done;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      mc anonymous set download local/$$MINIO_BUCKET;
      "

volumes:
  postgres_data:
  minio_data:

networks:
  default:
    ipam:
      config:
        - subnet: 10.90.14.0/24
